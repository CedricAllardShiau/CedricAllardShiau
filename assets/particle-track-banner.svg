<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 360" role="img" aria-labelledby="title description">
  <title id="title">Cedric Allard-Shiau — Aspiring Researcher / Developer / Physics at UVIC</title>
  <desc id="description">A starry black sky with glowing particle paths, a scientific grid, and a soft fade at the bottom.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050c"/>
      <stop offset=".62" stop-color="#080d1c"/>
      <stop offset="1" stop-color="#0b1428" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".62" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#67d9ff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#67d9ff" stop-opacity=".56"/>
      <stop offset="1" stop-color="#c8a8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nebula">
      <stop stop-color="#344d9c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#101a3c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#b6ccff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="bottom-fade">
      <rect width="1584" height="360" fill="url(#fade)"/>
    </mask>
    <style>
      .star { animation: twinkle 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .star:nth-of-type(3n) { animation-delay: -1.4s; }
      .star:nth-of-type(4n) { animation-delay: -2.6s; }
      .trace { animation: drift 16s ease-in-out infinite alternate; }
      @keyframes twinkle {
        0%, 100% { opacity: .35; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes drift {
        from { transform: translateX(-8px); }
        to { transform: translateX(8px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .star, .trace { animation: none; }
      }
    </style>
  </defs>

  <g mask="url(#bottom-fade)">
    <rect width="1584" height="360" fill="url(#sky)"/>
    <ellipse cx="1080" cy="84" rx="520" ry="235" fill="url(#nebula)"/>
    <rect width="1584" height="360" fill="url(#grid)"/>

    <g fill="#e5f4ff">
      <circle class="star" cx="84" cy="55" r="1.4"/>
      <circle class="star" cx="181" cy="122" r="1"/>
      <circle class="star" cx="274" cy="42" r="1.7"/>
      <circle class="star" cx="372" cy="96" r="1"/>
      <circle class="star" cx="463" cy="38" r="1.2"/>
      <circle class="star" cx="565" cy="120" r="1.5"/>
      <circle class="star" cx="658" cy="59" r="1"/>
      <circle class="star" cx="748" cy="37" r="1.5"/>
      <circle class="star" cx="848" cy="99" r="1"/>
      <circle class="star" cx="936" cy="47" r="1.3"/>
      <circle class="star" cx="1031" cy="118" r="1"/>
      <circle class="star" cx="1120" cy="34" r="1.6"/>
      <circle class="star" cx="1213" cy="84" r="1"/>
      <circle class="star" cx="1312" cy="45" r="1.3"/>
      <circle class="star" cx="1418" cy="105" r="1.5"/>
      <circle class="star" cx="1516" cy="52" r="1"/>
      <circle class="star" cx="129" cy="188" r="1.2"/>
      <circle class="star" cx="330" cy="177" r="1"/>
      <circle class="star" cx="510" cy="218" r="1.2"/>
      <circle class="star" cx="686" cy="183" r="1"/>
      <circle class="star" cx="894" cy="203" r="1.2"/>
      <circle class="star" cx="1071" cy="176" r="1"/>
      <circle class="star" cx="1265" cy="211" r="1.3"/>
      <circle class="star" cx="1460" cy="182" r="1"/>
    </g>

    <g class="trace" fill="none" stroke="url(#orbit)" stroke-width="1.5">
      <path d="M-60 284C230 40 390 314 670 180S1160 34 1644 258"/>
      <path d="M-50 316C248 106 400 338 697 214S1191 85 1634 291" stroke-opacity=".48"/>
      <path d="M-20 243C245 75 452 270 713 154S1195 65 1610 220" stroke-opacity=".35"/>
    </g>
    <g filter="url(#soft-glow)">
      <circle cx="674" cy="178" r="3.5" fill="#87e4ff"/>
      <circle cx="1102" cy="107" r="2.8" fill="#c5adff"/>
      <circle cx="1254" cy="196" r="2.2" fill="#87e4ff"/>
    </g>
  </g>

  <g text-anchor="middle">
    <text x="792" y="153" fill="#f2f6ff" font-family="'Space Grotesk', 'Avenir Next', 'Segoe UI', sans-serif" font-size="70" font-weight="600" letter-spacing="6">CEDRIC ALLARD-SHIAU</text>
    <path d="M682 180h68m84 0h68" stroke="#81ddff" stroke-opacity=".65" stroke-width="1"/>
    <circle cx="792" cy="180" r="3" fill="#9de6ff"/>
    <text x="792" y="215" fill="#b6c7e4" font-family="'Space Grotesk', 'Avenir Next', 'Segoe UI', sans-serif" font-size="18" font-weight="500" letter-spacing="5">Aspiring Researcher / Developer / Physics at UVIC</text>
  </g>
</svg>
